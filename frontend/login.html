<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F9D58" />
  <title>AfriSafe AI — Sign In</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .auth-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
      background: var(--bg);
    }
    /* Animated background blobs */
    .auth-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .auth-bg::before, .auth-bg::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(60px);
    }
    .auth-bg::before {
      width: 280px; height: 280px; top: -60px; right: -60px;
      background: radial-gradient(circle, rgba(15,157,88,0.15), transparent 70%);
      animation: float 6s ease-in-out infinite;
    }
    .auth-bg::after {
      width: 220px; height: 220px; bottom: -40px; left: -40px;
      background: radial-gradient(circle, rgba(30,136,229,0.15), transparent 70%);
      animation: float 7s ease-in-out infinite reverse;
    }

    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-xl);
      animation: fadeInUp var(--t-slow) var(--ease-out) both;
    }
    [data-theme="dark"] .auth-card { background: rgba(15,23,42,0.85); border-color: rgba(255,255,255,0.08); }

    .auth-logo {
      width: 64px; height: 64px; border-radius: 16px;
      margin: 0 auto 20px; display: block;
      animation: scaleIn 0.6s var(--ease-out) both;
    }
    .auth-title { font-size: var(--fs-title); font-weight: 700; text-align: center; letter-spacing: -0.02em; }
    .auth-subtitle { font-size: var(--fs-caption); color: var(--text-2); text-align: center; margin-top: 4px; margin-bottom: 28px; }

    .form-alert {
      padding: 12px 16px; border-radius: var(--radius);
      font-size: var(--fs-caption); font-weight: 600;
      margin-bottom: 16px; display: none;
      animation: fadeIn 0.2s ease both;
    }
    .form-alert.danger { background: var(--danger-bg); color: var(--danger); display: block; }
    .form-alert.success { background: var(--success-bg); color: var(--success); display: block; }

    .input-wrapper { position: relative; margin-bottom: 16px; }
    .input-wrapper .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none; z-index: 1;
    }
    .input-wrapper .form-control { padding-left: 46px; }
    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-3);
      padding: 8px; border-radius: 8px; cursor: pointer;
      transition: color var(--t) var(--ease);
    }
    .toggle-pass:hover { color: var(--primary); }

    .auth-options { display: flex; justify-content: flex-end; margin-bottom: 24px; }
    .auth-options a { font-size: var(--fs-caption); font-weight: 600; color: var(--secondary); }
    .auth-options a:hover { text-decoration: underline; }

    .btn-auth { position: relative; }
    .btn-auth .spinner { display: none; }
    .btn-auth.loading { pointer-events: none; }
    .btn-auth.loading .btn-text { opacity: 0.4; }
    .btn-auth.loading .spinner { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

    .biometric-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 20px 0; color: var(--text-2); font-size: var(--fs-tiny); font-weight: 500;
    }
    .biometric-row::before, .biometric-row::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .biometric-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: var(--radius-full);
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: var(--fs-caption); font-weight: 600; color: var(--text-2);
      transition: all var(--t) var(--ease); width: 100%;
    }
    .biometric-btn:hover { border-color: var(--primary); color: var(--primary); }
    .biometric-btn:active { transform: scale(0.97); }

    .auth-footer { text-align: center; margin-top: 24px; font-size: var(--fs-caption); color: var(--text-2); }
    .auth-footer a { font-weight: 600; color: var(--primary); }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <svg class="auth-logo" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="loginGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0F9D58"/><stop offset="1" stop-color="#1E88E5"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="url(#loginGrad)"/>
        <path d="M24 12v24M12 24h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your health journey</p>

      <div class="form-alert" id="formAlert"></div>

      <form id="loginForm" novalidate>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" class="form-control" id="email" placeholder="Email address" autocomplete="email" required />
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password visibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="auth-options">
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block btn-auth" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="biometric-row">or</div>
      <button class="biometric-btn" id="biometricBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 11c0 3.517-1.009 6.799-2.753 9.571"/><path d="M5 8.5a7 7 0 0 1 14 0"/><path d="M12 2a9 9 0 0 1 9 9"/><path d="M12 15v-1"/><path d="M8.5 15a3.5 3.5 0 0 1 7 0"/>
        </svg>
        Sign in with Biometrics
      </button>

      <p class="auth-footer">Don't have an account? <a href="registration.html">Create one</a></p>
    </div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script type="module" src="js/login.js"></script>
  <script>
    document.getElementById('togglePass').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
