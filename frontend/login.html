<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfriSafe AI - Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b5d3b 0%, #0f7a4a 55%, #d4af37 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.98);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0b5d3b, #d4af37);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(11,93,59,0.28);
    }

    .brand h1 {
      font-size: 30px;
      color: #0b5d3b;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .brand p {
      color: #5b6470;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #1f2937;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d7dce3;
      border-radius: 14px;
      font-size: 15px;
      transition: all .2s ease;
      background: #fff;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0b5d3b;
      box-shadow: 0 0 0 4px rgba(11,93,59,0.12);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0b5d3b, #0f7a4a);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .2s ease;
      box-shadow: 0 10px 24px rgba(11,93,59,0.22);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(11,93,59,0.28);
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      text-align: center;
      font-size: 14px;
      color: #c62828;
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .footer a {
      color: #0b5d3b;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>

</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="logo">A</div>
      <h1>AfriSafe AI</h1>
      <p>AI-powered malaria screening and healthcare assistance platform for Africa.</p>
    </div>

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email"
      required
    />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      required
    />
  </div>

  <button type="submit" class="login-btn" id="loginBtn">
    Sign In
  </button>

  <div id="status" class="status"></div>

  Don't have an account?
  <a href="register.html">Create an account</a>
</div>

</html>
