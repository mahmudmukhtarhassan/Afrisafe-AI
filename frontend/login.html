<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfriSafe AI - Login</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        width: 100%;
        max-width: 400px;
    }

    h1 {
        text-align: center;
        color: #1f4e66;
        margin-bottom: 10px;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    input:focus {
        outline: none;
        border-color: #1f4e66;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #1f4e66;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #163b4d;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .footer a {
        color: #1f4e66;
        text-decoration: none;
    }

    .footer a:hover {
        text-decoration: underline;
    }

    #status {
        margin-top: 15px;
        text-align: center;
        color: #d32f2f;
        min-height: 20px;
    }
</style>
```

</head>

<body>

```
<div class="login-container">
    <h1>AfriSafe AI</h1>
    <p>Sign in to continue</p>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            />
        </div>

        <button type="submit">Login</button>

        <div id="status"></div>

    </form>

    <div class="footer">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>
</div>

<!-- IMPORTANT: config.js must load first -->
<script src="js/config.js"></script>
<script src="js/login.js"></script>
```

</body>
</html>
