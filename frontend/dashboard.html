<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Your AfriSafe AI health dashboard">
  <title>Dashboard - AfriSafe AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/gemini-svg.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <meta name="theme-color" content="#0F9D58">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="greeting">
        <div class="greeting-time" id="greetingTime">Welcome</div>
        <div class="greeting-name" id="userName">User</div>
      </div>

      <!-- AI Health Status Hero -->
      <div class="health-hero">
        <h2>AI Health Status</h2>
        <p id="healthStatusText">Loading your latest assessment...</p>
        <a href="assessment.html" class="hero-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Quick Assessment
        </a>
      </div>

      <!-- Statistics -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card">
          <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
          <span class="stat-value" id="totalAssessments">—</span>
          <span class="stat-label">Total Assessments</span>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
          <span class="stat-value" id="positiveCases">—</span>
          <span class="stat-label">Positive Cases</span>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <span class="stat-value" id="negativeCases">—</span>
          <span class="stat-label">Negative Cases</span>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.3-2.3L7 14.3"/></svg></div>
          <span class="stat-value" id="highRiskCount">—</span>
          <span class="stat-label">High Risk Cases</span>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
          Recent Activity
        </div>
        <div id="historyList">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/bottomnav.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
