<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AfriSafe AI - Malaria Prevention Guidelines</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f5f7fb;color:#1f2937;line-height:1.5}header{background:#0f9d58;color:#fff;padding:1rem 1.5rem}header h1{font-size:1.4rem}main{max-width:1100px;margin:0 auto;padding:1.5rem}.search-input-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}.search-input-wrap svg{width:20px;height:20px;color:#6b7280}.search-input-wrap input{border:none;outline:none;width:100%;font-size:1rem;background:transparent}.category-pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:1.5rem}.cat-btn{padding:.55rem 1rem;border-radius:999px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-weight:600}.cat-btn.active{background:#0f9d58;color:#fff;border-color:#0f9d58}.spinner{display:none;text-align:center;padding:1.5rem;color:#0f9d58;font-weight:700}.guidelines-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}.guideline-card{background:#fff;border-radius:16px;padding:1rem;border:1px solid #e5e7eb;box-shadow:0 4px 14px rgba(0,0,0,.06)}.guideline-card h3{margin:.5rem 0;font-size:1.05rem;color:#111827}.guideline-card p{color:#4b5563;font-size:.95rem}.badge{display:inline-block;padding:.3rem .7rem;border-radius:999px;background:#e8f5e9;color:#0f9d58;font-size:.75rem;font-weight:700;text-transform:uppercase}.empty-state{text-align:center;padding:2rem;color:#6b7280}.hidden{display:none}.error-card{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:16px;padding:1rem}footer{text-align:center;color:#6b7280;padding:2rem 1rem;font-size:.9rem}</style></head><body><header><h1>AfriSafe AI - Malaria Prevention Guidelines</h1></header><main><div class="search-input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg><input type="text" id="searchInput" placeholder="Search guidelines..."></div><div class="category-pills" id="categoryPills"><button class="cat-btn active" data-cat="all">All Topics</button><button class="cat-btn" data-cat="vector">Vector Control</button><button class="cat-btn" data-cat="vaccine">Vaccines & SMC</button><button class="cat-btn" data-cat="treatment">Testing & ACTs</button><button class="cat-btn" data-cat="community">Sanitation</button><button class="cat-btn" data-cat="emergency">Emergency Signs</button></div><div id="loadingSpinner" class="spinner">Loading guidelines...</div><div id="guidelinesGrid" class="guidelines-grid"></div><div id="emptyResult" class="empty-state hidden"><h3>No matching guidelines found</h3><p>Try searching with a different term or select another category filter.</p></div></main><footer>&copy; 2026 AfriSafe AI. Nigeria Malaria Prevention Guidance.</footer><script type="module">import{API_BASE_URL}from'./js/config.js';const grid=document.getElementById('guidelinesGrid'),spinner=document.getElementById('loadingSpinner'),empty=document.getElementById('emptyResult'),searchInput=document.getElementById('searchInput'),categoryButtons=document.querySelectorAll('.cat-btn');let allGuidelines=[];async function loadGuidelines(category='all'){spinner.style.display='block';grid.innerHTML='';empty.classList.add('hidden');try{const res=await fetch(`${API_BASE_URL}/api/v1/prevention-guidelines?category=${category}`);if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();allGuidelines=data.guidelines||[];renderGuidelines(allGuidelines)}catch(e){console.error(e);grid.innerHTML='<div class="error-card"><h3>Failed to load guidelines</h3><p>Please check your internet connection and try again.</p></div>'}finally{spinner.style.display='none'}}function renderGuidelines(items){grid.innerHTML='';if(!items.length){empty.classList.remove('hidden');return}empty.classList.add('hidden');items.forEach(item=>{const card=document.createElement('div');card.className='guideline-card';card.innerHTML=`<span class="badge">${item.category}</span><h3>${item.title}</h3><p>${item.description}</p>`;grid.appendChild(card)})}searchInput.addEventListener('input',()=>{const q=searchInput.value.toLowerCase().trim();renderGuidelines(allGuidelines.filter(i=>i.title.toLowerCase().includes(q)||i.description.toLowerCase().includes(q)))});categoryButtons.forEach(btn=>btn.addEventListener('click',()=>{categoryButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadGuidelines(btn.dataset.cat)}));loadGuidelines();</script><script src="js/bottomnav.js"></script></body></html>
