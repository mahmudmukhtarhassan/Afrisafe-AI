<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07121A" />
  <title>AfriSafe AI — Reminders</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .unified-page{max-width:560px;margin:0 auto;padding:24px 18px 28px}.page-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}.heading-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0F9D58,#1E88E5);display:flex;align-items:center;justify-content:center;font-size:21px}.page-heading h1{margin:0;font-size:24px}.page-heading p{margin:4px 0 0;color:#94A3B8;font-size:12px;line-height:1.4}.card{background:#0F1720;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:17px;margin-bottom:14px}.card-title{font-size:16px;font-weight:750;margin-bottom:13px}.form-grid{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:650;color:#AAB4BF}.field input{width:100%;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 13px;background:#16202B;color:#fff;font:inherit;font-size:13px;outline:none}.field input:focus{border-color:#0F9D58;box-shadow:0 0 0 3px rgba(15,157,88,.1)}.btn-primary{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#0F9D58,#1E88E5);color:#fff;font-weight:750;cursor:pointer}.btn-primary:disabled{opacity:.6}.status-message{font-size:11px;color:#42D48A}.reminder-list{display:flex;flex-direction:column;gap:9px}.reminder-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:#16202B;border:1px solid rgba(255,255,255,.06)}.reminder-icon{width:40px;height:40px;border-radius:11px;background:rgba(15,157,88,.12);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.reminder-content{flex:1;min-width:0}.reminder-title{font-size:13px;font-weight:700;margin-bottom:4px}.reminder-date{font-size:11px;color:#94A3B8}.empty-state{text-align:center;padding:38px 16px;border-radius:18px;background:#16202B;color:#94A3B8;font-size:12px}.empty-state .icon{font-size:34px;margin-bottom:8px}
  </style>
</head>
<body>
  <main class="unified-page">
    <section class="page-heading"><div class="heading-icon">⏰</div><div><h1>Reminders</h1><p>Create and manage your health reminders.</p></div></section>
    <section class="card"><div class="card-title">Create reminder</div><form id="reminderForm" class="form-grid"><div class="field"><label for="title">Reminder title</label><input id="title" type="text" placeholder="Take medication or complete assessment" required /></div><div class="field"><label for="reminderDate">Reminder date &amp; time</label><input id="reminderDate" type="datetime-local" required /></div><button id="saveReminderBtn" type="submit" class="btn-primary">Save reminder</button><div id="statusMessage" class="status-message"></div></form></section>
    <section class="card"><div class="card-title">Upcoming reminders</div><div id="reminderList" class="reminder-list"><div class="empty-state"><div class="icon">⏰</div><div>Loading reminders...</div></div></div></section>
  </main>
  <script type="module" src="js/reminders.js"></script>
  <script type="module" src="js/bottomnav.js"></script>
</body>
</html>
