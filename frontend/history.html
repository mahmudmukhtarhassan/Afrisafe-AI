<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="View your full malaria risk assessment history">
  <title>History - AfriSafe AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/gemini-svg.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <meta name="theme-color" content="#0F9D58">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <h1 class="page-title">Assessment History</h1>
      <p class="page-subtitle">All your malaria risk assessments</p>

      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search assessments...">
      </div>

      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="positive">Positive</button>
        <button class="chip" data-filter="negative">Negative</button>
        <button class="chip" data-filter="high">High Risk</button>
        <button class="chip" data-filter="low">Low Risk</button>
      </div>

      <div id="historyContainer">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="hidden" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)this.classList.add('hidden')">
    <div style="background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:24px;max-height:80vh;overflow-y:auto;" id="detailContent"></div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/bottomnav.js"></script>
  <script type="module" src="js/history.js"></script>
</body>
</html>
