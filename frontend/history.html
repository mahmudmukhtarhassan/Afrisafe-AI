<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F9D58" />
  <title>AfriSafe AI — History</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .history-item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border-2);
      box-shadow: var(--shadow-sm);
      cursor: pointer; transition: all var(--t) var(--ease);
      margin-bottom: 10px;
    }
    .history-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .history-item:active { transform: scale(0.98); }
    .history-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .history-icon.green { background: var(--primary-light); color: var(--primary); }
    .history-icon.blue { background: var(--secondary-light); color: var(--secondary); }
    .history-icon.red { background: var(--danger-bg); color: var(--danger); }
    .history-icon.amber { background: var(--warning-bg); color: var(--warning); }
    .history-info { flex: 1; min-width: 0; }
    .history-date { font-size: var(--fs-body); font-weight: 600; }
    .history-meta { font-size: var(--fs-tiny); color: var(--text-2); margin-top: 2px; }
    .history-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .history-chevron { color: var(--text-3); flex-shrink: 0; }

    /* Detail Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease both;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      width: 100%; max-width: var(--max-width);
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 24px 20px calc(var(--safe-bottom) + 24px);
      max-height: 85vh; overflow-y: auto;
      animation: slideUp 0.3s var(--ease-out) both;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border); margin: 0 auto 20px;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface-2); display: flex; align-items: center; justify-content: center;
      color: var(--text-2);
    }
    .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-2); }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { font-size: var(--fs-caption); color: var(--text-2); font-weight: 500; }
    .detail-val { font-size: var(--fs-caption); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-main">
    <div class="fade-in-up">
      <h1 class="page-title">Assessment History</h1>
      <p class="page-subtitle">Track your health assessments over time</p>
    </div>

    <div class="search-bar fade-in-up" style="animation-delay: 50ms;">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search assessments..." />
    </div>

    <div class="filter-chips fade-in-up" style="animation-delay: 100ms;">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="positive">Positive</button>
      <button class="chip" data-filter="negative">Negative</button>
      <button class="chip" data-filter="high">High Risk</button>
      <button class="chip" data-filter="low">Low Risk</button>
    </div>

    <div id="historyContainer" class="fade-in-up" style="animation-delay: 150ms;">
      <div class="skeleton" style="height:72px;border-radius:18px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:72px;border-radius:18px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:72px;border-radius:18px;margin-bottom:10px;"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-sheet" id="detailSheet">
      <div class="modal-handle"></div>
      <button class="modal-close" id="modalClose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/bottomnav.js"></script>
  <script type="module" src="js/history.js"></script>
</body>
</html>
