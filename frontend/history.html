<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>History — AfriSafe AI</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Assessment History</h1>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/index.html">Home</a>
    </nav>
  </header>

  <main>
    <ul id="historyList"></ul>
  </main>

  <script type="module">
    import { API_BASE_URL } from "/js/config.js";
    import { fetchWithAuth } from "/js/auth.js";

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const r = await fetchWithAuth(`${API_BASE_URL}/api/v1/assessment/history`, { method: "GET" });
        if (!r.ok) return window.location.href = "/login.html";
        const history = await r.json();
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        history.forEach((a) => {
          const li = document.createElement("li");
          li.innerText = `${a.created_at} — ${a.result} (score: ${a.score})`;
          list.appendChild(li);
        });
      } catch (e) {
        window.location.href = "/login.html";
      }
    });
  </script>
</body>
</html>
