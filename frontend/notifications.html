<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07121A" />
  <title>AfriSafe AI — Notifications</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .unified-page{max-width:560px;margin:0 auto;padding:24px 18px 28px}.page-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}.heading-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#0F9D58,#1E88E5);display:flex;align-items:center;justify-content:center;font-size:21px}.page-heading h1{margin:0;font-size:24px}.page-heading p{margin:4px 0 0;color:#94A3B8;font-size:12px;line-height:1.4}.notification-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;color:#94A3B8;font-size:11px}.notification-toolbar span{margin-right:auto}.notification-toolbar button{border:1px solid rgba(255,255,255,.08);background:#0F1720;color:#D1D5DB;border-radius:10px;padding:8px 10px;font-size:11px;cursor:pointer}.notification-toolbar button:hover{border-color:#0F9D58;color:#42D48A}.notification-list{display:flex;flex-direction:column;gap:10px}.notification-card{display:flex;gap:12px;padding:15px;border-radius:17px;background:#0F1720;border:1px solid rgba(255,255,255,.08);color:#fff}.notification-card.unread{border-color:rgba(15,157,88,.45);background:rgba(15,157,88,.08)}.notification-icon{width:42px;height:42px;border-radius:12px;background:#16202B;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}.notification-content{flex:1;min-width:0}.notification-title{font-weight:750;font-size:14px;margin-bottom:5px}.notification-message{color:#AAB4BF;font-size:12px;line-height:1.5;margin-bottom:8px}.notification-meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.notification-time{color:#718096;font-size:10px}.notification-type{padding:5px 8px;border-radius:999px;background:rgba(30,136,229,.12);color:#60A5FA;font-size:9px;font-weight:750;text-transform:capitalize}.notification-actions{margin-top:9px}.mark-read-btn{border:0;border-radius:9px;padding:7px 10px;background:#0F9D58;color:#fff;font-size:10px;font-weight:700;cursor:pointer}.empty-state{text-align:center;padding:46px 20px;border-radius:19px;background:#0F1720;border:1px solid rgba(255,255,255,.08);color:#94A3B8;font-size:13px}.empty-state .icon{font-size:38px;margin-bottom:10px}
  </style>
</head>
<body>
  <main class="unified-page">
    <section class="page-heading"><div class="heading-icon">🔔</div><div><h1>Notifications</h1><p>Health alerts, prevention tips and important updates.</p></div></section>
    <div class="notification-toolbar"><span id="notificationCount">0 notifications</span><button id="markAllRead" type="button">Mark all as read</button><button id="clearNotifications" type="button">Clear all</button></div>
    <div id="notificationList" class="notification-list"><div class="empty-state"><div class="icon">🔔</div><div>Loading notifications...</div></div></div>
  </main>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/bottomnav.js"></script>
</body>
</html>
