<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfriSafe AI - Notifications</title>

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <style>
    .notifications-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }

    .page-subtitle {
      color: #6b7280;
      margin-top: 4px;
    }

    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notification-card {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .notification-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15,23,42,.08);
    }

    .notification-card.unread {
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .notification-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: #f3f4f6;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-title {
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .notification-message {
      color: #374151;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .notification-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .notification-time {
      color: #6b7280;
      font-size: 13px;
    }

    .notification-type {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f3f4f6;
      color: #374151;
      text-transform: capitalize;
    }

    .notification-type.reminder {
      background: #dcfce7;
      color: #166534;
    }

    .notification-type.assessment {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .notification-type.prevention {
      background: #fef3c7;
      color: #92400e;
    }

    .notification-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .mark-read-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      background: #111827;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .mark-read-btn:disabled {
      opacity: .6;
      cursor: default;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #6b7280;
    }

    .empty-state .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <main class="notifications-page">
    <div class="page-header">
      <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <div>
        <div class="page-title">Notifications</div>
        <div class="page-subtitle">Stay updated with your malaria health alerts and reminders.</div>
      </div>
    </div>

    <div id="notificationList" class="notification-list">
      <div class="empty-state">
        <div class="icon">🔔</div>
        <div>Loading notifications...</div>
      </div>
    </div>
  </main>

  <script type="module" src="js/notifications.js"></script>
</body>
</html>
