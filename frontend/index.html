<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F9D58" />
  <title>AfriSafe AI — Malaria Screening Powered by AI</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F9D58 0%, #1E88E5 100%);
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash::before, .splash::after {
      content: ''; position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .splash::before { width: 300px; height: 300px; top: -80px; right: -80px; animation: float 4s ease-in-out infinite; }
    .splash::after { width: 200px; height: 200px; bottom: -60px; left: -60px; animation: float 5s ease-in-out infinite reverse; }

    .splash-particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute; width: 6px; height: 6px;
      background: rgba(255,255,255,0.3); border-radius: 50%;
      animation: particleFloat 6s ease-in-out infinite;
    }
    .particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 1s; }
    .particle:nth-child(3) { left: 30%; top: 70%; animation-delay: 2s; }
    .particle:nth-child(4) { left: 70%; top: 75%; animation-delay: 0.5s; }
    .particle:nth-child(5) { left: 50%; top: 15%; animation-delay: 1.5s; }
    .particle:nth-child(6) { left: 20%; top: 50%; animation-delay: 2.5s; }
    .particle:nth-child(7) { left: 85%; top: 55%; animation-delay: 3s; }
    .particle:nth-child(8) { left: 45%; top: 85%; animation-delay: 1.2s; }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-20px) scale(1.5); opacity: 0.6; }
    }

    .splash-logo-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .splash-logo-wrap::before {
      content: ''; position: absolute; inset: -20px;
      border-radius: 50%; background: rgba(255,255,255,0.15);
      animation: pulseRing 2s ease-out infinite;
    }
    .splash-logo-wrap::after {
      content: ''; position: absolute; inset: -10px;
      border-radius: 50%; background: rgba(255,255,255,0.1);
      animation: pulseRing 2s ease-out infinite 0.5s;
    }
    .splash-logo {
      width: 96px; height: 96px; border-radius: 24px;
      position: relative; z-index: 1;
      animation: scaleIn 0.8s var(--ease-out) both;
    }

    .splash-brand { position: relative; z-index: 1; text-align: center; animation: fadeInUp 0.8s 0.3s var(--ease-out) both; }
    .splash-brand h1 { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .splash-brand p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 4px; }

    .splash-loader {
      margin-top: 32px; width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: relative; z-index: 1;
    }

    /* Landing content */
    .landing {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px; text-align: center;
      animation: fadeIn 0.6s var(--ease) both;
    }
    .landing-logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    .landing h1 { font-size: var(--fs-hero); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .landing .tagline { font-size: var(--fs-body); color: var(--text-2); max-width: 300px; margin-bottom: 32px; line-height: 1.6; }
    .feature-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; width: 100%; max-width: 320px; }
    .feature-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border-2);
      box-shadow: var(--shadow-sm); text-align: left;
    }
    .feature-check {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--gradient); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .feature-check svg { width: 20px; height: 20px; color: #fff; }
    .feature-text { display: flex; flex-direction: column; }
    .feature-text strong { font-size: var(--fs-body); font-weight: 600; }
    .feature-text span { font-size: var(--fs-tiny); color: var(--text-2); }
    .landing-cta { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div class="splash" id="splash">
    <div class="splash-particles">
      <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>
    <div class="splash-logo-wrap">
      <svg class="splash-logo" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="splashGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fff" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0.8"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="12" fill="rgba(255,255,255,0.15)"/>
        <path d="M24 12v24M12 24h24" stroke="url(#splashGrad)" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="splash-brand">
      <h1>AfriSafe AI</h1>
      <p>AI-Powered Malaria Screening</p>
    </div>
    <div class="splash-loader"></div>
  </div>

  <!-- Landing Page -->
  <div class="landing" id="landing" style="display:none;">
    <svg class="landing-logo" viewBox="0 0 48 48" fill="none">
      <defs>
        <linearGradient id="landingGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop stop-color="#0F9D58"/><stop offset="1" stop-color="#1E88E5"/>
        </linearGradient>
      </defs>
      <rect width="48" height="48" rx="12" fill="url(#landingGrad)"/>
      <path d="M24 12v24M12 24h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>AfriSafe <span class="gradient-text">AI</span></h1>
    <p class="tagline">AI-powered malaria screening built for Nigeria. Fast, private, and trusted.</p>
    <div class="feature-list stagger">
      <div class="feature-item">
        <div class="feature-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="feature-text"><strong>AI-Powered Screening</strong><span>Instant risk assessment</span></div>
      </div>
      <div class="feature-item">
        <div class="feature-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="feature-text"><strong>Built for Nigeria</strong><span>Local context, local care</span></div>
      </div>
      <div class="feature-item">
        <div class="feature-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="feature-text"><strong>Privacy Focused</strong><span>Your data stays yours</span></div>
      </div>
    </div>
    <div class="landing-cta">
      <a href="login.html" class="btn btn-primary btn-lg btn-block">Sign In</a>
      <a href="registration.html" class="btn btn-secondary btn-lg btn-block">Create Account</a>
    </div>
  </div>

  <script type="module">
    // Redirect to dashboard if already logged in
    try {
      const tokens = JSON.parse(localStorage.getItem('afrisafe_tokens') || '{}');
      if (tokens.access_token) {
        const payload = JSON.parse(atob(tokens.access_token.split('.')[1]));
        if (payload.exp && Date.now() < payload.exp * 1000) {
          window.location.href = '/dashboard.html';
        }
      }
    } catch (e) {}

    // Show splash, then landing
    const splash = document.getElementById('splash');
    const landing = document.getElementById('landing');
    setTimeout(() => {
      splash.classList.add('hidden');
      landing.style.display = 'flex';
    }, 2000);
  </script>
</body>
</html>
