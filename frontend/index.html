<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AfriSafe AI - AI-Powered Malaria Risk Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/gemini-svg.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <meta name="theme-color" content="#0F9D58">
  <meta name="description" content="AfriSafe AI - AI-powered malaria risk prediction and triage system for Nigeria.">
  <style>
    .landing { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .landing-logo { width: 72px; height: 72px; background: var(--primary-light); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .landing-logo img { width: 48px; height: 48px; }
    .landing h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .landing h1 .highlight { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .landing p { font-size: 1rem; color: var(--text-muted); line-height: 1.6; max-width: 380px; margin-bottom: 28px; }
    .landing-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
    .feature-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; text-align: left; }
    .feature-item { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 600; }
    .feature-check { width: 24px; height: 24px; background: var(--success-bg); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-logo"><img src="assets/gemini-svg.svg" alt="AfriSafe AI"></div>
    <h1>AfriSafe <span class="highlight">AI</span></h1>
    <p>AI-powered early malaria risk assessment designed to support safer healthcare decisions across Nigeria.</p>
    <ul class="feature-list">
      <li class="feature-item"><span class="feature-check">✓</span> AI-Powered Screening</li>
      <li class="feature-item"><span class="feature-check">✓</span> Built for Nigeria</li>
      <li class="feature-item"><span class="feature-check">✓</span> Privacy Focused</li>
    </ul>
    <div class="landing-actions">
      <a href="login.html" class="btn btn-primary btn-lg btn-block">Sign In</a>
      <a href="registration.html" class="btn btn-secondary btn-lg btn-block">Create Account</a>
    </div>
  </div>

  <script>
    // Redirect to dashboard if already logged in
    try {
      const tokens = JSON.parse(localStorage.getItem("afrisafe_tokens"));
      if (tokens && tokens.access_token) {
        window.location.href = "/dashboard.html";
      }
    } catch {}
  </script>
</body>
</html>
