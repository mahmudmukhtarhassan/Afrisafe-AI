<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Assessment — AfriSafe AI</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Assessment</h1>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <form id="assessmentForm" class="card">
      <p>Fill the assessment fields below. Numeric fields will be used to compute a score.</p>
      <label>Question 1 (0-1)
        <input name="q1" type="number" min="0" max="1" step="0.01" required />
      </label>
      <label>Question 2 (0-1)
        <input name="q2" type="number" min="0" max="1" step="0.01" required />
      </label>
      <label>Question 3 (true/false)
        <select name="q3">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </label>
      <button type="submit">Submit Assessment</button>
    </form>

    <div id="result" class="card" aria-live="polite"></div>
  </main>

  <script type="module" src="/js/assessment.js"></script>
</body>
</html>
