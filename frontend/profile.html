<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — AfriSafe AI</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <h1>Profile</h1>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/index.html">Home</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Your profile</h2>
      <p>Email: <span id="userEmail">—</span></p>
      <p>This page can be expanded to edit profile information.</p>
    </section>
  </main>

  <script type="module">
    import { API_BASE_URL } from "/js/config.js";
    import { fetchWithAuth } from "/js/auth.js";

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const r = await fetchWithAuth(`${API_BASE_URL}/api/v1/auth/me`, { method: "GET" });
        if (!r.ok) return window.location.href = "/login.html";
        const me = await r.json();
        document.getElementById("userEmail").innerText = me.email || me.user_metadata?.email || "Unknown";
      } catch (e) {
        window.location.href = "/login.html";
      }
    });
  </script>
</body>
</html>
