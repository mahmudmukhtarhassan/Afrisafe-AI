<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Create your AfriSafe AI account">
  <title>Register - AfriSafe AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/gemini-svg.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <meta name="theme-color" content="#0F9D58">
  <style>
    .auth-page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-logo { width: 56px; height: 56px; background: var(--primary-light); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .auth-logo img { width: 36px; height: 36px; }
    .auth-title { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 4px; }
    .auth-subtitle { font-size: 0.88rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    .form-alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; display: none; }
    .form-alert.error { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .form-alert.warning { display: block; background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .input-wrapper { position: relative; }
    .input-wrapper .toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 16px; }
    .checkbox-row input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--primary); }
    .checkbox-row label { font-size: 0.82rem; color: var(--text-muted); }
    .checkbox-row a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 20px; }
    .auth-footer a { color: var(--primary); font-weight: 700; text-decoration: none; }
    .btn-spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo"><img src="assets/gemini-svg.svg" alt="AfriSafe AI"></div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Get started with AI-powered malaria risk screening</p>

      <div id="formAlert" class="form-alert" role="alert"></div>

      <form id="registerForm">
        <div class="input-group">
          <label class="input-label" for="full_name">Full Name</label>
          <input type="text" class="form-control" id="full_name" placeholder="Enter your full name" required autocomplete="name">
          <div class="field-error" id="fullNameError"></div>
        </div>
        <div class="input-group">
          <label class="input-label" for="email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required autocomplete="email">
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label class="input-label" for="age">Age</label>
            <input type="number" class="form-control" id="age" placeholder="Years" min="1" max="120">
            <div class="field-error" id="ageError"></div>
          </div>
          <div class="input-group">
            <label class="input-label" for="gender">Gender</label>
            <select class="form-control" id="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Other</option></select>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label" for="state">State of Residence</label>
          <select class="form-control" id="state"><option value="">Select your state...</option></select>
          <div class="field-error" id="stateError"></div>
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="toggle-pass" id="passwordToggle" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="termsAgree" required>
          <label for="termsAgree">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary btn-block btn-lg">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden" id="registerSpinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/helpers.js"></script>
  <script type="module" src="js/registration.js"></script>
  <script>
    const NIGERIAN_STATES = ["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
    document.addEventListener("DOMContentLoaded", () => {
      const stateSelect = document.getElementById("state");
      NIGERIAN_STATES.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; stateSelect.appendChild(o); });
      const toggle = document.getElementById("passwordToggle");
      const passwordInput = document.getElementById("password");
      toggle.addEventListener("click", () => { passwordInput.type = passwordInput.type === "password" ? "text" : "password"; });
    });
  </script>
</body>
</html>
